# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: RVCPocket
options:
  bundleIdPrefix: com.rvc-mlx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your team (or pick it in Xcode → Signing & Capabilities)
packages:
  RVCKit:
    path: RVCKit
targets:
  RVCPocket:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RVCKit
    entitlements:
      path: App/RVCPocket.entitlements
      properties:
        # MLX models are large; this lets the app use more of the device's memory (recommended by mlx-swift).
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RVC Pocket
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: RVC Pocket records your voice so it can convert it on this device.
        # Show Documents in the Files app ("On My iPhone › RVC Pocket") so models can be dropped in from a Mac.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rvc-mlx.safetensors
            UTTypeDescription: RVC model (safetensors)
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [safetensors]
        CFBundleDocumentTypes:
          - CFBundleTypeName: RVC model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rvc-mlx.safetensors]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvc-mlx.pocket
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
