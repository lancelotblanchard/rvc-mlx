name: Tests

# Triggers:
#   * push to main / develop    -> CI on the protected branches after merge
#   * push to claude/**         -> CI on Claude Code feature branches without needing an open PR
#   * pull_request to main      -> CI on PRs targeting main (the standard PR check)
#   * workflow_dispatch         -> manual re-run from the Actions tab
on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit comes in. Saves macOS minutes during iterative pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-latest is on Apple Silicon, which is required for MLX. Pinning to `macos-latest` keeps us on the GitHub
    # default; revisit if we ever need a specific macOS version (e.g. macos-14 vs macos-15).
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v --cov=rvc_mlx --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
